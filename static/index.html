<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BharatBot — Indian History Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e0d0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a0a00, #2d1a00);
      border-bottom: 2px solid #c8843a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      font-size: 32px;
    }

    .header-text h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f5c87a;
      letter-spacing: 0.5px;
    }

    .header-text p {
      font-size: 13px;
      color: #a08060;
      margin-top: 2px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .avatar { background: #3d2200; border: 1.5px solid #c8843a; }
    .message.bot  .avatar { background: #1a0d00; border: 1.5px solid #8b5e2a; }

    .bubble {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.65;
      max-width: calc(100% - 60px);
    }

    .message.user .bubble {
      background: #2d1800;
      border: 1px solid #c8843a44;
      color: #f0dfc0;
      border-top-right-radius: 4px;
    }

    .message.bot .bubble {
      background: #1a1208;
      border: 1px solid #4a3010;
      color: #e8e0d0;
      border-top-left-radius: 4px;
    }

    .bubble h1, .bubble h2, .bubble h3 { color: #f5c87a; margin: 12px 0 6px; font-size: 1em; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 4px 0; }
    .bubble strong { color: #f5c87a; }
    .bubble em { color: #c8a878; }
    .bubble p { margin: 6px 0; }
    .bubble code { background: #2a1a00; padding: 1px 5px; border-radius: 4px; font-size: 13px; color: #f5c87a; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
    .bubble th { background: #2d1800; color: #f5c87a; padding: 6px 10px; border: 1px solid #4a3010; }
    .bubble td { padding: 5px 10px; border: 1px solid #2a1a00; }
    .bubble tr:nth-child(even) td { background: #1f1008; }
    .bubble blockquote { border-left: 3px solid #c8843a; padding-left: 12px; color: #c0a878; margin: 8px 0; }

    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #2a1a00;
      font-size: 12px;
      color: #8a7050;
    }

    .sources span {
      background: #2d1800;
      border: 1px solid #4a3010;
      border-radius: 12px;
      padding: 2px 8px;
      margin: 2px 3px;
      display: inline-block;
      color: #c8a060;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: #1a1208;
      border: 1px solid #4a3010;
      border-radius: 14px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 8px; height: 8px;
      background: #c8843a;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    .input-area {
      background: #140e06;
      border-top: 1px solid #2a1a00;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: #1a1208;
      border: 1.5px solid #3a2510;
      border-radius: 12px;
      color: #e8e0d0;
      font-size: 15px;
      padding: 12px 16px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      min-height: 50px;
      max-height: 140px;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #c8843a; }
    textarea::placeholder { color: #5a4030; }

    button#send-btn {
      background: linear-gradient(135deg, #c8843a, #a05c1a);
      border: none;
      border-radius: 12px;
      width: 50px;
      height: 50px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    button#send-btn:hover { transform: scale(1.05); }
    button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px 12px;
      background: #140e06;
    }

    .suggestion {
      background: #1a1208;
      border: 1px solid #3a2510;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #c8a060;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .suggestion:hover { background: #2d1800; border-color: #c8843a; color: #f5c87a; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #3a2510; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="header-icon">🏛️</div>
  <div class="header-text">
    <h1>BharatBot</h1>
    <p>Indian History · Kingdoms · Kings · Hinduism · Sacred Cities</p>
  </div>
</header>

<div class="chat-container" id="chat"></div>

<div class="suggestions" id="suggestions">
  <div class="suggestion" onclick="sendSuggestion(this)">What is the first kingdom in India?</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Tell me about the Maurya Empire</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Who was Ashoka?</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Origins of Hinduism</div>
  <div class="suggestion" onclick="sendSuggestion(this)">Chola dynasty and South India</div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask about Indian history, kings, kingdoms, Hinduism..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const suggestions = document.getElementById("suggestions");
  let history = [];

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addMessage(role, content, sources = []) {
    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "🏛️";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = marked.parse(content);

    if (sources.length > 0) {
      const src = document.createElement("div");
      src.className = "sources";
      src.innerHTML = "Sources: " + sources.map(s => `<span>${s}</span>`).join("");
      bubble.appendChild(src);
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.id = "typing";
    msg.innerHTML = `<div class="avatar">🏛️</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage(text = null) {
    const question = (text || input.value).trim();
    if (!question) return;

    suggestions.style.display = "none";
    input.value = "";
    autoResize();
    sendBtn.disabled = true;

    addMessage("user", question);
    history.push({ role: "user", content: question });
    addTyping();

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history: history.slice(-6) })
      });
      const data = await res.json();
      removeTyping();
      addMessage("bot", data.answer, data.sources || []);
      history.push({ role: "assistant", content: data.answer });
    } catch (err) {
      removeTyping();
      addMessage("bot", "Error connecting to the server. Make sure the backend is running.");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  function sendSuggestion(el) {
    sendMessage(el.textContent);
  }

  // Welcome message
  window.addEventListener("DOMContentLoaded", () => {
    addMessage("bot", `**Namaste! Welcome to BharatBot.** 🙏\n\nI can answer your questions about:\n- **Indian Kingdoms & Dynasties** — Maurya, Gupta, Chola, Mughal & more\n- **Hindu History** — Vedas, epics, deities, sacred texts\n- **Indian Kings** — Ashoka, Chandragupta, Rajaraja Chola, Akbar & more\n- **Sacred Cities** — Varanasi, Ayodhya, Mathura, Madurai & their history\n- **Maps & Geography** — where kingdoms rose and fell\n\nWhat would you like to explore?`);
  });
</script>
</body>
</html>
